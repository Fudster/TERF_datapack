name: Publish resource pack to Modrinth

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'pack.png'
      - 'pack.mcmeta'   # so a version bump also republishes the RP
      - 'LICENSE.txt'
      - '.github/workflows/publish-resourcepack.yml'
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional suffix appended to the auto version (e.g. "rc1")'
        required: false
        default: ''

concurrency:
  group: modrinth-publish-resourcepack
  cancel-in-progress: false

env:
  MODRINTH_SLUG: troty-energy-research-facility-resource-pack
  GAME_VERSION: "1.21.11"
  RESOURCEPACK_FORMAT: 75
  # Major.minor read from pack.mcmeta's "version" field; patch = commit count.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          BUILD=$(git rev-list --count HEAD)
          MAJOR_MINOR=$(jq -r '.pack.version // "1.0"' pack.mcmeta)
          VERSION="${MAJOR_MINOR}.${BUILD}"
          NAME="TERF resource pack build ${BUILD}"
          if [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            VERSION="${VERSION}-${{ github.event.inputs.version_suffix }}"
            NAME="${NAME} (${{ github.event.inputs.version_suffix }})"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Computed: ${VERSION} — ${NAME}"

      - name: Build resource pack zip
        run: |
          # assets/ ships without its own pack.mcmeta — synthesize one here.
          # RP pack_format differs from datapack pack_format for the same MC version.
          if [ ! -f assets/pack.mcmeta ]; then
            cat > assets/pack.mcmeta <<EOF
          {
            "pack": {
              "pack_format": ${{ env.RESOURCEPACK_FORMAT }},
              "description": "TERF resource pack"
            }
          }
          EOF
          fi
          if [ ! -f assets/pack.png ]; then
            cp pack.png assets/pack.png
          fi
          mkdir -p dist
          (cd assets && zip -r "../dist/TERF-resourcepack-${{ steps.ver.outputs.version }}.zip" .)
          ls -lh dist/

      - name: Upload to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_SLUG }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/TERF-resourcepack-*.zip
          name: ${{ steps.ver.outputs.name }}
          version: ${{ steps.ver.outputs.version }}
          version-type: release
          loaders: minecraft
          game-versions: ${{ env.GAME_VERSION }}
          changelog: |
            Automated publish from commit ${{ github.sha }}.
            See https://github.com/${{ github.repository }}/commit/${{ github.sha }}
