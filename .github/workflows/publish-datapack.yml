name: Publish datapack to Modrinth

on:
  push:
    # TODO(before-upstream-pr): drop 'ci/**'.
    branches: [main, 'ci/**']
    paths:
      - 'data/**'
      - 'pack.mcmeta'
      - 'pack.png'
      - 'LICENSE.txt'
      - '.github/workflows/publish-datapack.yml'
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional suffix appended to the auto version (e.g. "rc1")'
        required: false
        default: ''

concurrency:
  group: modrinth-publish-datapack
  cancel-in-progress: false

env:
  # TODO(before-upstream-pr): swap to troty-energy-research-facility
  MODRINTH_SLUG: terf-test-datapack
  GAME_VERSION: "1.21.11"
  # Bump when cutting a real new major/minor; patch is the commit count.
  VERSION_MAJOR_MINOR: "1.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          BUILD=$(git rev-list --count HEAD)
          VERSION="${VERSION_MAJOR_MINOR}.${BUILD}"
          NAME="TERF datapack build ${BUILD}"
          if [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            VERSION="${VERSION}-${{ github.event.inputs.version_suffix }}"
            NAME="${NAME} (${{ github.event.inputs.version_suffix }})"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Computed: ${VERSION} — ${NAME}"

      - name: Build datapack zip
        run: |
          mkdir -p dist
          zip -r "dist/TERF-datapack-${{ steps.ver.outputs.version }}.zip" \
              data pack.mcmeta pack.png LICENSE.txt README.md
          ls -lh dist/

      - name: Upload to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_SLUG }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/TERF-datapack-*.zip
          name: ${{ steps.ver.outputs.name }}
          version: ${{ steps.ver.outputs.version }}
          version-type: release
          loaders: datapack
          game-versions: ${{ env.GAME_VERSION }}
          changelog: |
            Automated publish from commit ${{ github.sha }}.
            See https://github.com/${{ github.repository }}/commit/${{ github.sha }}
